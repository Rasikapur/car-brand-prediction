services:
  app:
    image: ${ECR_REGISTRY:-local}/${ECR_REPOSITORY:-car-brand-predictor}:${TAG:-latest}
    build: .
    container_name: car-brand-predictor
    ports:
      - "80:5000"
    restart: unless-stopped
    depends_on:
      - mlflow
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5001

  mlflow:
    image: python:3.11-slim
    container_name: mlflow-server
    command: >
      sh -c "pip install -q mlflow==2.20.4 &&
             mlflow server --host 0.0.0.0 --port 5001
               --backend-store-uri sqlite:///data/mlflow.db
               --default-artifact-root /data/mlruns
               --serve-artifacts"
    ports:
      - "5001:5001"
    volumes:
      - mlflow_data:/data
    working_dir: /data
    restart: unless-stopped

volumes:
  mlflow_data:
