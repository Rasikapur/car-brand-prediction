<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Brand Predictor</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f5f5f5;
        }
        h1 { color: #333; }
        .card {
            background: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        label { display: block; margin-top: 16px; font-weight: 600; color: #444; }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 4px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            padding: 12px 24px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        button:hover { background: #1d4ed8; }
        .result {
            margin-top: 20px;
            padding: 16px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 4px;
        }
        .result h2 { margin: 0 0 8px; color: #166534; }
        .result p { margin: 4px 0; color: #333; }
        .error {
            margin-top: 20px;
            padding: 16px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 4px;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Car Brand Predictor</h1>
        <form method="POST" action="/predict">
            <label for="price">Price ($)</label>
            <input type="number" name="price" id="price" step="1000" required>

            <label for="mileage">Mileage (MPG)</label>
            <input type="number" name="mileage" id="mileage" step="0.1" required>

            <label for="car_type">Car Type</label>
            <select name="car_type" id="car_type">
                {% for t in car_types %}
                <option value="{{ t }}">{{ t }}</option>
                {% endfor %}
            </select>

            <label for="month">Month</label>
            <select name="month" id="month">
                {% for m in months %}
                <option value="{{ m }}">{{ m }}</option>
                {% endfor %}
            </select>

            <label for="year">Year</label>
            <select name="year" id="year">
                {% for y in years %}
                <option value="{{ y }}">{{ y }}</option>
                {% endfor %}
            </select>

            <button type="submit">Predict Brand</button>
        </form>

        {% if result %}
        <div class="result">
            <h2>Predicted Brand: {{ result.predicted_brand }}</h2>
            {% if result.top_brands %}
            <p><strong>Top predictions:</strong></p>
            {% for brand in result.top_brands %}
            <p>{{ brand }}</p>
            {% endfor %}
            {% endif %}
        </div>
        {% endif %}

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
