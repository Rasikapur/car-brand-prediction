name: Build & Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest flake8 -r requirements.txt
      - run: python train.py
      - run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,venv
      - run: pytest tests/ -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/car-brand-predictor:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USERNAME }}/car-brand-predictor

            # Pull latest docker-compose and config from repo
            git pull origin main

            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/car-brand-predictor:latest

            # Update docker-compose to use the pulled image
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}

            # Restart services
            docker compose down
            docker compose up -d

            # Clean up old images
            docker image prune -f
